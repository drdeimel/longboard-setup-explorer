<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Windrose top-view mockup</title>
  <desc id="desc">A transparent positive-only 32-sample propulsion ratio windrose centered behind the front axle.</desc>
  <rect width="900" height="600" fill="#0f172a"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .positive { fill: #38bdf8; stroke: #7dd3fc; stroke-width: 1; opacity: .72; }
    .context { stroke: #94a3b8; fill: none; }
    .muted { fill: #94a3b8; }
  </style>

  <text x="24" y="32" fill="#e2e8f0" font-size="16">TOP VIEW — PROPULSION RATIO MOCKUP</text>
  <text x="24" y="54" class="muted" font-size="11">positive propulsion ratio only · force along front wheel direction / applied force · lean = +12° · 32 samples</text>

  <!-- Board and axle context. X/board-forward is upward on screen. -->
  <g transform="translate(210 95)">
    <rect x="0" y="0" width="150" height="420" rx="34" fill="#38bdf8" fill-opacity=".06" stroke="#38bdf8" stroke-opacity=".45" stroke-width="2"/>
    <line x1="-28" y1="48" x2="178" y2="48" class="context" stroke-width="3"/>
    <line x1="-28" y1="372" x2="178" y2="372" class="context" stroke-width="3"/>
    <text x="75" y="-12" fill="#cbd5e1" font-size="11" text-anchor="middle">front</text>
    <text x="75" y="445" fill="#cbd5e1" font-size="11" text-anchor="middle">rear</text>
    <text x="75" y="220" fill="#64748b" font-size="11" text-anchor="middle" transform="rotate(-90 75 220)">board forward</text>
  </g>

  <!-- Main windrose: 350 mm diameter, centered on the board behind the front axle. -->
  <g transform="translate(-175 -20)">
    <!-- Positive (>0) directional wedge leaves from a 32-direction sample grid. -->
    <g stroke="none" transform="translate(460 205) scale(2) translate(-460 -205) rotate(180 460 205)">
      <path d="M 460 205 L 455.1 105.3 A 99.9 99.9 0 0 1 464.9 105.3 Z" class="positive"/>
      <path d="M 460 205 L 475.3 101.9 A 104.3 104.3 0 0 1 485.3 103.9 Z" class="positive"/>
      <path d="M 460 205 L 495.3 106.4 A 104.7 104.7 0 0 1 504.8 110.4 Z" class="positive"/>
      <path d="M 460 205 L 512.0 118.3 A 101.1 101.1 0 0 1 520.2 123.8 Z" class="positive"/>
      <path d="M 460 205 L 522.8 135.7 A 93.6 93.6 0 0 1 529.3 142.2 Z" class="positive"/>
      <path d="M 460 205 L 526.2 155.9 A 82.5 82.5 0 0 1 530.7 162.6 Z" class="positive"/>
      <path d="M 460 205 L 521.6 175.8 A 68.2 68.2 0 0 1 524.2 182.0 Z" class="positive"/>
      <path d="M 460 205 L 509.8 192.5 A 51.3 51.3 0 0 1 510.7 197.5 Z" class="positive"/>
      <path d="M 460 205 L 492.4 203.4 A 32.4 32.4 0 0 1 492.4 206.6 Z" class="positive"/>
      <path d="M 460 205 L 472.2 206.8 A 12.3 12.3 0 0 1 472.0 208.0 Z" class="positive"/>
      <path d="M 460 205 L 452.2 202.2 A 8.2 8.2 0 0 1 452.6 201.5 Z" class="positive"/>
      <path d="M 460 205 L 435.6 190.3 A 28.5 28.5 0 0 1 437.1 188.0 Z" class="positive"/>
      <path d="M 460 205 L 424.7 173.0 A 47.7 47.7 0 0 1 428.0 169.7 Z" class="positive"/>
      <path d="M 460 205 L 421.3 152.8 A 65.0 65.0 0 0 1 426.6 149.2 Z" class="positive"/>
      <path d="M 460 205 L 425.9 132.8 A 79.8 79.8 0 0 1 433.1 129.8 Z" class="positive"/>
      <path d="M 460 205 L 437.7 116.1 A 91.6 91.6 0 0 1 446.6 114.4 Z" class="positive"/>
    </g>

    <text x="460" y="335" fill="#e2e8f0" font-size="12" text-anchor="middle">700 mm diameter</text>
    <text x="460" y="352" class="muted" font-size="10" text-anchor="middle">center ≈ front foot, slightly behind axle</text>
  </g>

  <!-- Zero-steer reference inset. -->
  <g transform="translate(650 105)">
    <text x="0" y="0" fill="#e2e8f0" font-size="12">ZERO-STEER REFERENCE</text>
    <circle cx="105" cy="105" r="72" fill="#38bdf8" fill-opacity=".04" stroke="#38bdf8" stroke-opacity=".3"/>
    <line x1="105" y1="105" x2="105" y2="33" stroke="#38bdf8" stroke-width="5" opacity=".75"/>
    <text x="105" y="205" class="muted" font-size="10" text-anchor="middle">only ratios &gt; 0 shown</text>
  </g>

  <g transform="translate(650 365)">
    <text x="0" y="0" fill="#e2e8f0" font-size="12">LEGEND</text>
    <line x1="0" y1="26" x2="34" y2="26" stroke="#38bdf8" stroke-width="4"/>
    <text x="46" y="30" class="muted" font-size="10">positive propulsion component</text>
    <text x="0" y="65" class="muted" font-size="10">r(theta) = max(0, cos(theta − wheel steer))</text>
    <text x="0" y="82" class="muted" font-size="10">32-direction sample grid; nonpositive omitted</text>
  </g>

</svg>
